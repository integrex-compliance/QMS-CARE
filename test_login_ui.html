<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .loginmodal-container {
            padding: 30px;
            max-width: 350px;
            width: 100% !important;
            background-color: #F7F7F7;
            margin: 50px auto;
            border-radius: 2px;
            box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
        }
        .loginmodal-container h1 {
            text-align: center;
            font-size: 1.8em;
        }
        .loginmodal-container input[type=text], input[type=password] {
            height: 44px;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
            background: #fff;
            border: 1px solid #d9d9d9;
            padding: 0 8px;
            box-sizing: border-box;
        }
        .loginmodal-submit {
            border: 0px;
            color: #fff;
            background-color: #4d90fe;
            padding: 17px 0px;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="loginmodal-container">
        <h1>Login Test</h1><br>
        
        <!-- Error Alert - Click button below to show -->
        <div class="alert alert-danger" id="errorAlert" style="display: none;">
            <button type="button" class="close" onclick="$('#errorAlert').hide()">
                <span>&times;</span>
            </button>
            <span><strong>Invalid Login!</strong> Email ID or Password is incorrect.</span>
        </div>
        
        <form>
            <input type="text" placeholder="User Email" required />
            <div style="position: relative;">
                <input type="password" id="password" placeholder="Password" required style="padding-right: 40px;" />
                <span class="toggle-password" style="position: absolute; right: 10px; top: 12px; cursor: pointer; color: #666;">
                    <i class="fa fa-eye" id="toggleIcon"></i>
                </span>
            </div>
            <button type="button" class="loginmodal-submit" onclick="showInvalidAlert()">Test Error Message</button>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            $(".toggle-password").click(function() {
                var passwordField = $("#password");
                var icon = $("#toggleIcon");
                
                if (passwordField.attr("type") === "password") {
                    passwordField.attr("type", "text");
                    icon.removeClass("fa-eye").addClass("fa-eye-slash");
                } else {
                    passwordField.attr("type", "password");
                    icon.removeClass("fa-eye-slash").addClass("fa-eye");
                }
            });
        });
        
        function showInvalidAlert() {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Login!',
                html: '<b>Entered Email ID or Password is wrong.</b><br>Please enter correct credentials.',
                confirmButtonText: 'OK',
                confirmButtonColor: '#d33',
                allowOutsideClick: false,
                customClass: {
                    popup: 'animated bounceIn'
                }
            });
        }
    </script>
</body>
</html>
